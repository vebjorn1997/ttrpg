version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: drizzle_postgres_db
    restart: always
    environment:
      POSTGRES_USER: axsman
      POSTGRES_PASSWORD: dribble2
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    # Bind-mounting PGDATA into this repo (OneDrive/NTFS) makes every query wait
    # on Windows file sync. Prefer a named Docker volume on the WSL2 disk:
    #   volumes: [pgdata:/var/lib/postgresql]
    volumes:
      - ./data:/var/lib/postgresql

volumes:
  data: