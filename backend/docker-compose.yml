version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: drizzle_postgres_db
    restart: always
    environment:
      POSTGRES_USER: axsman
      POSTGRES_PASSWORD: dribble2
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql

volumes:
  data: